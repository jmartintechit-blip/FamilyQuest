version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Expo pins the versions of react, react-native and every expo-* package, so routine
    # bumps are done by hand with `npx expo install --fix`. Limit 0 turns off version-update
    # PRs but keeps Dependabot security updates.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
