name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Syntax check
        working-directory: backend
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      # Each test file starts the real server in a temporary directory and talks to it over HTTP and Socket.IO.
      - name: Test
        working-directory: backend
        run: npm test
      # Warning only: a registry hiccup or a new advisory must not block merges.
      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev
        continue-on-error: true

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build web bundle
        working-directory: frontend
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web-dist"
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
        continue-on-error: true
