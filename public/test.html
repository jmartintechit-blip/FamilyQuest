<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de chat</title>
</head>
<body>
  <h2>Chat de prueba - Familia 1</h2>

  <div id="usuario">
    <label>Tu usuario_id: </label>
    <input type="number" id="miUsuarioId" value="1">
  </div>

  <div id="mensajes" style="border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px; margin: 10px 0;"></div>

  <input type="text" id="textoMensaje" placeholder="Escribe un mensaje...">
  <button onclick="enviarMensaje()">Enviar</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const familiaId = 1;

    socket.emit('unirse_familia', familiaId);

    socket.on('mensaje_nuevo', (mensaje) => {
      mostrarMensaje(mensaje);
    });

    function mostrarMensaje(mensaje) {
      const div = document.getElementById('mensajes');
      const p = document.createElement('p');
      p.textContent = `${mensaje.autor}: ${mensaje.texto}`;
      div.appendChild(p);
      div.scrollTop = div.scrollHeight;
    }

    function enviarMensaje() {
      const texto = document.getElementById('textoMensaje').value;
      const usuarioId = document.getElementById('miUsuarioId').value;

      fetch('http://localhost:3000/mensajes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ familia_id: familiaId, usuario_id: parseInt(usuarioId), texto })
      });

      document.getElementById('textoMensaje').value = '';
    }
  </script>
</body>
</html>
